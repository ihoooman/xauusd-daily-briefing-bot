name: Daily XAUUSD Persian Briefing

on:
  schedule:
    # 12:00 Tehran is 08:30 UTC while Iran is UTC+03:30.
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate report
        env:
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ECONOMIC_CALENDAR_API_KEY: ${{ secrets.ECONOMIC_CALENDAR_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          POLYMARKET_API_URL: ${{ vars.POLYMARKET_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Asia/Tehran
          REPORT_TIME: "12:00"
        run: python main.py
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-report
          path: output/reports/*.md
