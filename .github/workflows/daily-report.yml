name: Daily XAUUSD Persian Briefing

on:
  schedule:
    # 12:00 Asia/Tehran (UTC+03:30)
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-xauusd-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate report
        env:
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ECONOMIC_CALENDAR_API_KEY: ${{ secrets.ECONOMIC_CALENDAR_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          POLYMARKET_API_URL: ${{ vars.POLYMARKET_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Asia/Tehran
          REPORT_TIME: "12:00"
        run: python main.py
      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: xauusd-report
          path: output/reports/*.md
          retention-days: 14
